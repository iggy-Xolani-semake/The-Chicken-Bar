<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d94821" />
    <title>Chicken Bar Admin</title>
    <style>
      :root { color-scheme: dark; }
      body {
        align-items: center;
        background: #1d1b18;
        color: #f7f0e7;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      main { max-width: 28rem; }
      img { height: 5rem; margin-bottom: 1.5rem; width: 5rem; }
      h1 { color: #ff7043; font-size: 1.75rem; margin: 0 0 0.75rem; }
      p { color: #d7cec3; line-height: 1.5; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo/badge-final.png" alt="The Chicken Bar" />
      <h1>You are offline</h1>
      <p>The admin app is ready, but live orders need an internet connection. Reconnect and open the app again to refresh.</p>
    </main>
  </body>
</html>
